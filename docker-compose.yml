version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/threatlens.db
    environment:
      - SECRET_KEY=${SECRET_KEY:-threatlens-secret-2024}
      - DATABASE_URL=sqlite+aiosqlite:///./threatlens.db
      - DEBUG=False
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
